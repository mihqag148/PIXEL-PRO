name: Build HX8357B static stages v3

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/HX8357B_STATIC_*_V3/**'
      - '.github/workflows/build-hx8357b-static-stages-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/HX8357B_STATIC_*_V3/**'
      - '.github/workflows/build-hx8357b-static-stages-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BASELINE
            sketch: diagnostics/HX8357B_STATIC_BASELINE_V3
          - name: POWER_VCOM
            sketch: diagnostics/HX8357B_STATIC_POWER_VCOM_V3
          - name: PANEL_GAMMA
            sketch: diagnostics/HX8357B_STATIC_PANEL_GAMMA_V3
          - name: BRIGHTNESS
            sketch: diagnostics/HX8357B_STATIC_BRIGHTNESS_V3

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@3.3.12; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 10
            arduino-cli core update-index
          done

      - name: Compile ${{ matrix.name }}
        run: |
          mkdir -p build dist/raw
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s2:PSRAM=enabled,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,FlashMode=dio" \
            --build-path build \
            --output-dir dist/raw \
            "${{ matrix.sketch }}"

      - name: Package merged ${{ matrix.name }}
        run: |
          python -m pip install --quiet esptool
          APP_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bin' | head -n1)"
          BOOT_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bootloader.bin' | head -n1)"
          PART_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.partitions.bin' | head -n1)"
          BOOT_APP0="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.12/tools/partitions/boot_app0.bin"

          test -n "$APP_BIN" && test -n "$BOOT_BIN" && test -n "$PART_BIN" && test -f "$BOOT_APP0"

          cp "$APP_BIN" "dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_app.bin"
          cp "$BOOT_BIN" "dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_bootloader.bin"
          cp "$PART_BIN" "dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_partitions.bin"
          cp "$BOOT_APP0" dist/boot_app0.bin

          esptool --chip esp32s2 merge-bin \
            -o "dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_merged.bin" \
            0x1000 "dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_bootloader.bin" \
            0x8000 "dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_partitions.bin" \
            0xe000 dist/boot_app0.bin \
            0x10000 "dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_app.bin"

          sha256sum "dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_merged.bin" > "dist/SHA256SUMS_${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PIXEL-PRO-HX8357B-STATIC-${{ matrix.name }}-V3
          path: |
            dist/PIXEL_PRO_HX8357B_STATIC_${{ matrix.name }}_V3_*.bin
            dist/SHA256SUMS_${{ matrix.name }}
          if-no-files-found: error

  pr-checks:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PIXEL-PRO-HX8357B-STATIC-*-V3
          path: dist
          merge-multiple: true

      - name: Write instructions
        run: |
          cat > dist/README-HX8357B-STATIC-STAGES-V3.txt <<'EOF'
          PIXEL PRO HX8357-B STATIC STAGES v3

          Purpose:
          Eliminate the v1/v2 phase-switching, marker-bar, second-window and
          repeated-redraw variables. Each binary performs ONE cold init,
          ONE full-screen 0xFFFF write, then leaves the bus idle forever.

          Wiring is unchanged:
            LCD_RD    -> 3V3
            LCD_RST   -> EN
            LCD_WR    -> D13
            LCD_RS/DC -> D14
            LCD_CS    -> D16
            LCD_D0..D7 -> D33..D40

          D15 is unused. If nothing is connected there, leave it empty.

          Flash each merged.bin at offset 0x0000.

          Test order:
          1. BASELINE
             Exact logic copied from the previously proven TFT_WHITE_INVON
             diagnostic. This is the critical control sample.
          2. POWER_VCOM
             Same baseline + D0/D1/D2 analog power and VCOM registers.
          3. PANEL_GAMMA
             Same + power/VCOM + panel-driving and gamma registers.
          4. BRIGHTNESS
             Same + all above + DCS brightness FF, CTRL Display 2C, CABC off.

          Report for each binary:
          - full screen or only a strip/area?
          - bright or dim?
          - stable or flickering?

          If BASELINE is not full-screen bright, do not infer anything from
          POWER/VCOM/brightness; the root cause is below those register groups.
          EOF

      - name: Publish v3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tft-hx8357b-static-stages-v3"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PIXEL PRO HX8357-B Static Stages v3" \
              --notes "Four independent one-shot binaries: proven baseline, power/VCOM, panel/gamma and brightness. No marker bar, phase switching, second window or repeated redraw." \
              dist/*
          fi

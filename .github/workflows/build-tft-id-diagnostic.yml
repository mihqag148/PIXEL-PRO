name: Build TFT ID diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/TFT_ID_READER/**'
      - '.github/workflows/build-tft-id-diagnostic.yml'
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/TFT_ID_READER/**'
      - '.github/workflows/build-tft-id-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@3.3.12; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "ESP32 core install failed after 3 attempts."
              exit 1
            fi
            sleep 10
            arduino-cli core update-index
          done

      - name: Compile TFT ID diagnostic
        run: |
          mkdir -p build dist/raw
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s2:PSRAM=enabled,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,FlashMode=dio" \
            --build-path build \
            --output-dir dist/raw \
            diagnostics/TFT_ID_READER

      - name: Package merged diagnostic image
        run: |
          python -m pip install --quiet esptool
          APP_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bin' | head -n1)"
          BOOT_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bootloader.bin' | head -n1)"
          PART_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.partitions.bin' | head -n1)"
          BOOT_APP0="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.12/tools/partitions/boot_app0.bin"

          test -n "$APP_BIN" && test -n "$BOOT_BIN" && test -n "$PART_BIN"
          test -f "$BOOT_APP0"

          cp "$APP_BIN" dist/PIXEL_PRO_TFT_ID_DIAG_app.bin
          cp "$BOOT_BIN" dist/PIXEL_PRO_TFT_ID_DIAG_bootloader.bin
          cp "$PART_BIN" dist/PIXEL_PRO_TFT_ID_DIAG_partitions.bin
          cp "$BOOT_APP0" dist/boot_app0.bin

          esptool --chip esp32s2 merge-bin \
            -o dist/PIXEL_PRO_TFT_ID_DIAG_merged.bin \
            0x1000 dist/PIXEL_PRO_TFT_ID_DIAG_bootloader.bin \
            0x8000 dist/PIXEL_PRO_TFT_ID_DIAG_partitions.bin \
            0xe000 dist/boot_app0.bin \
            0x10000 dist/PIXEL_PRO_TFT_ID_DIAG_app.bin

          cat > dist/README-TFT-ID.txt <<'EOF'
          PIXEL PRO TFT ID diagnostic

          TEMPORARY WIRING:
          LCD_RD    -> D15
          RGB DATA  -> DISCONNECTED from D15
          LCD_WR    -> D13
          LCD_RS/DC -> D14
          LCD_CS    -> D16
          LCD_RST   -> EN
          LCD_D0    -> D33
          LCD_D1    -> D34
          LCD_D2    -> D35
          LCD_D3    -> D36
          LCD_D4    -> D37
          LCD_D5    -> D38
          LCD_D6    -> D39
          LCD_D7    -> D40

          Flash PIXEL_PRO_TFT_ID_DIAG_merged.bin at offset 0x0.
          Open the native USB serial port. The diagnostic prints a report every
          three seconds. Send the full block from PIXEL_PRO_TFT_ID_DIAG|1 through
          END_TFT_ID_DIAG back to ChatGPT.
          EOF

          sha256sum dist/PIXEL_PRO_TFT_ID_DIAG_merged.bin > dist/SHA256SUMS-TFT-ID

      - uses: actions/upload-artifact@v4
        with:
          name: PIXEL-PRO-TFT-ID-DIAG
          path: |
            dist/PIXEL_PRO_TFT_ID_DIAG_*.bin
            dist/README-TFT-ID.txt
            dist/SHA256SUMS-TFT-ID
          if-no-files-found: error

  pr-checks:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PIXEL-PRO-TFT-ID-DIAG
          path: dist

      - name: Publish TFT ID diagnostic release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tft-id-diag-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PIXEL PRO TFT ID Diagnostic v1" \
              --notes "Temporary diagnostic firmware. Move LCD_RD from 3V3 to D15 and disconnect RGB DATA from D15 before flashing." \
              dist/*
          fi

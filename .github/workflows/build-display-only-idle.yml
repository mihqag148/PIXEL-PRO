name: Build display-only idle diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'firmware/PIXEL_PRO/**'
      - '.github/workflows/build-display-only-idle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/PIXEL_PRO/**'
      - '.github/workflows/build-display-only-idle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@3.3.12; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 10
            arduino-cli core update-index
          done

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino@1.6.8"
          arduino-cli lib install "AnimatedGIF@2.2.0"
          arduino-cli lib install "JPEGDEC@1.8.4"
          arduino-cli lib install "Adafruit NeoPixel@1.15.5"

      - name: Compile display-only idle diagnostic
        run: |
          mkdir -p build dist/raw
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s2:PSRAM=enabled,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,FlashMode=dio" \
            --build-property compiler.cpp.extra_flags="-DPIXEL_DIAG_TOUCH_OFF=1 -DPIXEL_DIAG_SAFE_PAR8=1 -DPIXEL_DIAG_DISPLAY_ONLY_IDLE=1" \
            --build-path build \
            --output-dir dist/raw \
            firmware/PIXEL_PRO

      - name: Package merged image
        run: |
          python -m pip install --quiet esptool
          APP_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bin' | head -n1)"
          BOOT_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bootloader.bin' | head -n1)"
          PART_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.partitions.bin' | head -n1)"
          BOOT_APP0="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.12/tools/partitions/boot_app0.bin"
          test -n "$APP_BIN" && test -n "$BOOT_BIN" && test -n "$PART_BIN" && test -f "$BOOT_APP0"

          cp "$APP_BIN" dist/PIXEL_PRO_DISPLAY_ONLY_IDLE_app.bin
          cp "$BOOT_BIN" dist/PIXEL_PRO_DISPLAY_ONLY_IDLE_bootloader.bin
          cp "$PART_BIN" dist/PIXEL_PRO_DISPLAY_ONLY_IDLE_partitions.bin
          cp "$BOOT_APP0" dist/boot_app0.bin

          esptool --chip esp32s2 merge-bin \
            -o dist/PIXEL_PRO_DISPLAY_ONLY_IDLE_merged.bin \
            0x1000 dist/PIXEL_PRO_DISPLAY_ONLY_IDLE_bootloader.bin \
            0x8000 dist/PIXEL_PRO_DISPLAY_ONLY_IDLE_partitions.bin \
            0xe000 dist/boot_app0.bin \
            0x10000 dist/PIXEL_PRO_DISPLAY_ONLY_IDLE_app.bin

          cat > dist/README-DISPLAY-ONLY-IDLE.txt <<'EOF'
          PIXEL PRO display-only idle diagnostic v1

          Uses the exact production display class/init path, conservative PAR8
          timing, HX8357-B 0x8357, INVON, touch off.

          After init it fills 0xFFFF once and then does NOTHING forever.
          No SD, module bus, LittleFS, USB runtime, RGB animation, saver, touch,
          key polling or menu rendering runs after the white fill.

          Keep RGB DATA disconnected from D15.

          Judge only:
          - is the screen bright or dim?
          - does it flicker?
          - is the frame stable?
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: PIXEL-PRO-DISPLAY-ONLY-IDLE
          path: dist/*
          if-no-files-found: error

  pr-checks:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PIXEL-PRO-DISPLAY-ONLY-IDLE
          path: dist

      - name: Publish diagnostic release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tft-display-only-idle-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PIXEL PRO Display-Only Idle Test v1" \
              --notes "Exact production display init, safe PAR8, then one 0xFFFF fill and complete idle." \
              dist/*
          fi

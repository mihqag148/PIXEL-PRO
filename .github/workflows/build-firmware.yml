name: Build PIXEL PRO ESP32-S2 firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/idf/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s2
          path: firmware/idf
          command: idf.py build && idf.py merge-bin -o PIXEL_PRO_v0.1.4_merged.bin -f raw

      - name: Show build output
        run: |
          find firmware/idf/build -maxdepth 2 -type f -printf "%p %s bytes\n" | sort | tail -n 80

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-pro-v0.1.4
          path: |
            firmware/idf/build/PIXEL_PRO_v0.1.4_merged.bin
            firmware/idf/build/*.bin
            firmware/idf/build/*.elf
            firmware/idf/build/*.map
            firmware/idf/sdkconfig
          if-no-files-found: error

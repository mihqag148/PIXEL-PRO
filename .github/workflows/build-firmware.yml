name: Build and release PIXEL PRO native USB firmware

on:
  push:
    branches: [main, feature/native-usb-reset]
    paths:
      - 'firmware/**'
      - 'VERSION'
      - 'docs/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-pro-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@3.3.12; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "ESP32 core install failed after 3 attempts."
              exit 1
            fi
            echo "ESP32 package CDN failed; retrying attempt $((attempt + 1))/3..."
            sleep 10
            arduino-cli core update-index
          done

      - name: Install Arduino_GFX 1.6.8
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino@1.6.8"

      - name: Install AnimatedGIF 2.2.0
        run: |
          arduino-cli lib install "AnimatedGIF@2.2.0"

      - name: Compile ESP32-S2 native USB firmware
        run: |
          mkdir -p build dist
          arduino-cli compile             --fqbn "esp32:esp32:esp32s2:PSRAM=enabled,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,FlashMode=dio"             --build-path build             --output-dir dist/raw             firmware/PIXEL_PRO

      - name: Package flash images
        run: |
          python -m pip install --quiet esptool
          APP_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bin' | head -n1)"
          BOOT_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bootloader.bin' | head -n1)"
          PART_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.partitions.bin' | head -n1)"
          test -n "$APP_BIN" && test -n "$BOOT_BIN" && test -n "$PART_BIN"
          BOOT_APP0="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.12/tools/partitions/boot_app0.bin"
          test -f "$BOOT_APP0"
          cp "$APP_BIN" dist/PIXEL_PRO_app.bin
          cp "$BOOT_BIN" dist/PIXEL_PRO_bootloader.bin
          cp "$PART_BIN" dist/PIXEL_PRO_partitions.bin
          cp "$BOOT_APP0" dist/boot_app0.bin
          esptool --chip esp32s2 merge-bin -o dist/PIXEL_PRO_merged.bin             0x1000 dist/PIXEL_PRO_bootloader.bin             0x8000 dist/PIXEL_PRO_partitions.bin             0xe000 dist/boot_app0.bin             0x10000 dist/PIXEL_PRO_app.bin
          cp docs/FLASH.md dist/FLASH.md
          cp docs/HARDWARE.md dist/HARDWARE.md
          cp docs/USB_PROTOCOL.md dist/USB_PROTOCOL.md
          VERSION="$(cat VERSION | tr -d '\r\n')"
          printf 'PIXEL PRO native USB %s\nCommit: %s\nRun: %s\nCore: arduino-esp32 3.3.12\n'             "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          sha256sum dist/PIXEL_PRO_merged.bin dist/PIXEL_PRO_app.bin > dist/SHA256SUMS
          python - <<'PY'
          import json, pathlib, os
          v=pathlib.Path("VERSION").read_text().strip()
          data={"version":v,"framework":"arduino-esp32","core":"3.3.12","asset":"PIXEL_PRO_merged.bin","flashOffset":"0x0"}
          pathlib.Path("dist/firmware-manifest.json").write_text(json.dumps(data,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: PIXEL-PRO-NATIVE-USB
          path: |
            dist/PIXEL_PRO_*.bin
            dist/boot_app0.bin
            dist/FLASH.md
            dist/HARDWARE.md
            dist/USB_PROTOCOL.md
            dist/BUILD-INFO.txt
            dist/SHA256SUMS
            dist/firmware-manifest.json
          if-no-files-found: error

  pr-checks:
    name: PR checks
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PIXEL-PRO-NATIVE-USB
          path: dist
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION | tr -d '\r\n')"
          TAG="fw-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserved."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA"             --title "PIXEL PRO Native USB $VERSION"             --notes "ESP32-S2 native TinyUSB firmware: HID keyboard + USB CDC."             dist/*

name: Build HX8357B power brightness sweep

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/HX8357B_POWER_BRIGHTNESS_SWEEP/**'
      - '.github/workflows/build-hx8357b-power-brightness-sweep.yml'
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/HX8357B_POWER_BRIGHTNESS_SWEEP/**'
      - '.github/workflows/build-hx8357b-power-brightness-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@3.3.12; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 10
            arduino-cli core update-index
          done

      - name: Compile
        run: |
          mkdir -p build dist/raw
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s2:PSRAM=enabled,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,FlashMode=dio" \
            --build-path build \
            --output-dir dist/raw \
            diagnostics/HX8357B_POWER_BRIGHTNESS_SWEEP

      - name: Package merged image
        run: |
          python -m pip install --quiet esptool
          APP_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bin' | head -n1)"
          BOOT_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bootloader.bin' | head -n1)"
          PART_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.partitions.bin' | head -n1)"
          BOOT_APP0="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.12/tools/partitions/boot_app0.bin"

          test -n "$APP_BIN" && test -n "$BOOT_BIN" && test -n "$PART_BIN" && test -f "$BOOT_APP0"

          cp "$APP_BIN" dist/PIXEL_PRO_HX8357B_POWER_SWEEP_app.bin
          cp "$BOOT_BIN" dist/PIXEL_PRO_HX8357B_POWER_SWEEP_bootloader.bin
          cp "$PART_BIN" dist/PIXEL_PRO_HX8357B_POWER_SWEEP_partitions.bin
          cp "$BOOT_APP0" dist/boot_app0.bin

          esptool --chip esp32s2 merge-bin \
            -o dist/PIXEL_PRO_HX8357B_POWER_SWEEP_merged.bin \
            0x1000 dist/PIXEL_PRO_HX8357B_POWER_SWEEP_bootloader.bin \
            0x8000 dist/PIXEL_PRO_HX8357B_POWER_SWEEP_partitions.bin \
            0xe000 dist/boot_app0.bin \
            0x10000 dist/PIXEL_PRO_HX8357B_POWER_SWEEP_app.bin

          cat > dist/README-HX8357B-POWER-SWEEP.txt <<'EOF'
          PIXEL PRO HX8357-B POWER / VCOM / BRIGHTNESS SWEEP v1

          Keep RGB DATA disconnected from D15.

          The test repeats forever, 8 seconds per phase.
          The screen background is always 0xFFFF white.
          A 20-pixel bar at the top identifies the phase:

          RED BAR:
            Minimal MCUFRIEND-style init + INVON.

          GREEN BAR:
            Full Adafruit HX8357-B panel/power/VCOM/gamma init + INVON.

          BLUE BAR:
            Same full Adafruit-style init + force:
              Display brightness = 0xFF
              CTRL Display = 0x2C
              CABC = OFF

          Report which bar phase is brightest/full-bright, and whether any phase
          flickers.

          Normal wiring:
            LCD_RD  -> 3V3
            LCD_RST -> EN
            LCD_WR  -> D13
            LCD_DC  -> D14
            LCD_CS  -> D16
            LCD_D0..D7 -> D33..D40
          EOF

          sha256sum dist/PIXEL_PRO_HX8357B_POWER_SWEEP_merged.bin > dist/SHA256SUMS-HX8357B-POWER-SWEEP

      - uses: actions/upload-artifact@v4
        with:
          name: PIXEL-PRO-HX8357B-POWER-SWEEP
          path: |
            dist/PIXEL_PRO_HX8357B_POWER_SWEEP_*.bin
            dist/README-HX8357B-POWER-SWEEP.txt
            dist/SHA256SUMS-HX8357B-POWER-SWEEP
          if-no-files-found: error

  pr-checks:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PIXEL-PRO-HX8357B-POWER-SWEEP
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tft-hx8357b-power-sweep-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/PIXEL_PRO_HX8357B_POWER_SWEEP_*.bin \
              dist/README-HX8357B-POWER-SWEEP.txt \
              dist/SHA256SUMS-HX8357B-POWER-SWEEP
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PIXEL PRO HX8357-B Power Brightness Sweep v1" \
              --notes "Three repeating white-screen phases compare minimal init, full HX8357-B power/VCOM init, and forced max display-brightness control." \
              dist/PIXEL_PRO_HX8357B_POWER_SWEEP_*.bin \
              dist/README-HX8357B-POWER-SWEEP.txt \
              dist/SHA256SUMS-HX8357B-POWER-SWEEP
          fi

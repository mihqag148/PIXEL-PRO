name: Build post-init stage diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'firmware/PIXEL_PRO/**'
      - '.github/workflows/build-post-init-stage-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/PIXEL_PRO/**'
      - '.github/workflows/build-post-init-stage-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@3.3.12; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 10
            arduino-cli core update-index
          done

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino@1.6.8"
          arduino-cli lib install "AnimatedGIF@2.2.0"
          arduino-cli lib install "JPEGDEC@1.8.4"
          arduino-cli lib install "Adafruit NeoPixel@1.15.5"

      - name: Compile post-init stage diagnostic
        run: |
          mkdir -p build dist/raw
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s2:PSRAM=enabled,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,FlashMode=dio" \
            --build-property compiler.cpp.extra_flags="-DPIXEL_DIAG_TOUCH_OFF=1 -DPIXEL_DIAG_SAFE_PAR8=1 -DPIXEL_DIAG_POST_INIT_STAGE=1" \
            --build-path build \
            --output-dir dist/raw \
            firmware/PIXEL_PRO

      - name: Package merged image
        run: |
          python -m pip install --quiet esptool
          APP_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bin' | head -n1)"
          BOOT_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.bootloader.bin' | head -n1)"
          PART_BIN="$(find dist/raw -maxdepth 1 -name '*.ino.partitions.bin' | head -n1)"
          BOOT_APP0="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.12/tools/partitions/boot_app0.bin"
          test -n "$APP_BIN" && test -n "$BOOT_BIN" && test -n "$PART_BIN" && test -f "$BOOT_APP0"

          cp "$APP_BIN" dist/PIXEL_PRO_POST_INIT_STAGE_app.bin
          cp "$BOOT_BIN" dist/PIXEL_PRO_POST_INIT_STAGE_bootloader.bin
          cp "$PART_BIN" dist/PIXEL_PRO_POST_INIT_STAGE_partitions.bin
          cp "$BOOT_APP0" dist/boot_app0.bin

          esptool --chip esp32s2 merge-bin \
            -o dist/PIXEL_PRO_POST_INIT_STAGE_merged.bin \
            0x1000 dist/PIXEL_PRO_POST_INIT_STAGE_bootloader.bin \
            0x8000 dist/PIXEL_PRO_POST_INIT_STAGE_partitions.bin \
            0xe000 dist/boot_app0.bin \
            0x10000 dist/PIXEL_PRO_POST_INIT_STAGE_app.bin

          cat > dist/README-POST-INIT-STAGE.txt <<'EOF'
          PIXEL PRO POST-INIT STAGE TEST v1

          Keep RGB DATA disconnected from D15.

          The test adds production components cumulatively after the known-good
          display-only state. Watch for the FIRST stage where dimming/flicker begins.

          0 DISPLAY ONLY   = display init only
          1 SD / SPI       = add SD/SPI init
          2 I2C INIT       = add module I2C init
          3 FLASH / MEDIA  = mount LittleFS + load persisted media
          4 MAIN MENU      = render real Main Menu once
          5 USB            = start USB composite stack
          6 KEYS + CDC     = runtime key/roller/CDC polling
          7 RGB POLL       = add RGB runtime polling
          8 MODULE POLL    = add module polling
          9 FULL LOOP      = add saver polling; stays here

          Stages 0-5 last about 5 seconds each.
          Stages 6-8 last about 7 seconds each.
          Stage 9 remains forever.

          Touch remains disabled throughout.
          EOF

          sha256sum dist/PIXEL_PRO_POST_INIT_STAGE_merged.bin > dist/SHA256SUMS-POST-INIT-STAGE

      - uses: actions/upload-artifact@v4
        with:
          name: PIXEL-PRO-POST-INIT-STAGE
          path: |
            dist/PIXEL_PRO_POST_INIT_STAGE_*.bin
            dist/README-POST-INIT-STAGE.txt
            dist/SHA256SUMS-POST-INIT-STAGE
          if-no-files-found: error

  pr-checks:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PIXEL-PRO-POST-INIT-STAGE
          path: dist

      - name: Publish stage diagnostic release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tft-post-init-stage-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/PIXEL_PRO_POST_INIT_STAGE_*.bin \
              dist/README-POST-INIT-STAGE.txt \
              dist/SHA256SUMS-POST-INIT-STAGE
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PIXEL PRO Post-Init Stage Test v1" \
              --notes "Cumulative stage test to locate which subsystem first causes TFT dimming/flicker." \
              dist/PIXEL_PRO_POST_INIT_STAGE_*.bin \
              dist/README-POST-INIT-STAGE.txt \
              dist/SHA256SUMS-POST-INIT-STAGE
          fi
